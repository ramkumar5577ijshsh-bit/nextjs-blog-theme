<!-- Static skeleton so Netlify detects the enquiry form at build time -->
<html>
  <body>
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="name" />
      <input name="email" />
      <select name="service"></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
